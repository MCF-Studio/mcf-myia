name: Release

# Pousser un tag vX.Y.Z construit l'installateur Windows et publie une release GitHub.
# Sécurité de la chaîne : actions figées sur des commits, pas de cache sur les builds de release,
# construction en lecture seule ; seul le job de publication a le droit d'écrire.
on:
  push:
    tags: ["v*.*.*"]

permissions: {}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: npm ci
        working-directory: agent
      - run: npm test
        working-directory: agent
      - run: npm ci
        working-directory: app
      - name: Version du tag = version de l'app
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          app_v=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          if [ "$v" != "$app_v" ]; then echo "Tag $v ≠ version de l'app $app_v (tauri.conf.json)"; exit 1; fi
      - run: npx tauri build
        working-directory: app
      - name: Empreinte
        shell: bash
        run: |
          mkdir out
          cp app/src-tauri/target/release/bundle/nsis/*-setup.exe out/
          (cd out && sha256sum *-setup.exe > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer
          path: out/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: installer
          path: out
      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*-setup.exe out/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "MyIA $GITHUB_REF_NAME" \
            --notes "Installateur Windows (par utilisateur, sans droits admin). Prérequis : Ollama (https://ollama.com). L'installateur n'est pas encore signé : Windows SmartScreen peut afficher un avertissement (« Informations complémentaires » → « Exécuter quand même »). Vérifie l'empreinte avec SHA256SUMS.txt."

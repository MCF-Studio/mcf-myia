[package]
name = "myia"
version = "0.2.1"
description = "MyIA : agent local du quotidien (MCF Studio)"
authors = ["MCF Studio"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.80"

[lib]
name = "myia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.40"
portable-pty = "0.9"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
